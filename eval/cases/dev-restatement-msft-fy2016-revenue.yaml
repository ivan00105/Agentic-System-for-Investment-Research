id: dev-restatement-msft-fy2016-revenue
split: dev
case_type: restatement
mode: check
source: Hand-built (restatement after ASC 606 adoption)
question: What was Microsoft's revenue in fiscal 2016, and has that figure changed since it was first reported?
cutoff: 2018-09-30
companies:
  - ticker: MSFT
    cik: 789019
    name: Microsoft Corporation
expected:
  behaviour: answer
  must_mention:
    - The figure was restated from 85,320 to 91,154 when Microsoft adopted the new revenue standard (ASC 606) with the full retrospective method in fiscal 2018.
    - Which filing each figure comes from.
  must_not:
    - Gives only one figure for fiscal 2016 revenue without mentioning the restatement.
    - Treats the 5,834 difference as revenue growth.
