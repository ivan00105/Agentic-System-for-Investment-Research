notes: >-
  The FY2018 10-K says Microsoft early-adopted the new revenue standard on 1 July 2017 with the
  full retrospective method, restating prior periods; the main change was Windows 10 revenue
  recognition. Its income statement shows FY2016 total revenue of 91,154 (first reported as
  85,320, +6.8%) while total cost of revenue stays at 32,780. REFERENCE §5 warns that
  companyfacts holds later restated values, so a cutoff filter alone returns 91,154 with no hint
  of the original.
