  checked_by: null
  check_note: null
notes: >-
  Apple 391,035 / 383,285 - 1 = 2.02%; Microsoft 245,122 / 211,915 - 1 = 15.67%. Apple's FY2024
  10-K says fiscal 2024 and 2022 spanned 52 weeks and fiscal 2023 spanned 53 (the extra week fell
  in Q1 2023). Microsoft's fiscal year ends 30 June. A trailing-twelve-month comparison to a
  common date is a valid extra, not a replacement for the labelled fiscal figures.
