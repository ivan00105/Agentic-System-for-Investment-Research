notes: >-
  (305,826 + 62,283) / 6,779,511 = 5.43%, matching FinanceBench's 5.4%. Netflix's content amortization
  is a separate, much larger cash-flow row; the question's definition leaves it out. No tool measures
  D&A or EBITDA, so those two items need review; revenue and operating income are scored automatically.
