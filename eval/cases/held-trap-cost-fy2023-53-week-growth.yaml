notes: >-
  242,290 / 226,954 - 1 = 6.76%. The income statement's column headings say 53 and 52 weeks, and Item 7
  says net sales rose 7% helped by "one additional week of sales in 2023"; the 10-K does not size the
  extra week, so the report should flag it, not quantify it. Total revenue adds membership fees to net
  sales. Not related to dev-fb-cost-fy2021-total-assets (another year, metric and filing).
