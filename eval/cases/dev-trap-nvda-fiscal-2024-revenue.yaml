notes: >-
  NVIDIA's fiscal year ends on the last Sunday in January and is named after the calendar year
  it ends in, so fiscal 2024 is almost all of calendar 2023 (52 weeks, per the 10-K). The cutoff
  is after the FY2025 10-K (0001045810-25-000023, filed 2025-02-26), so the trap is live: that
  filing shows 130,497 / 60,922 / 26,974 for fiscal 2025 / 2024 / 2023, and companyfacts tags
  all three columns with the filing's fy (REFERENCE §5). The FY2025 10-K repeats 60,922
  unchanged.
