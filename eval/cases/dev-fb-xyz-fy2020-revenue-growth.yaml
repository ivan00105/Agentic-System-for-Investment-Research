notes: >-
  9,497,578 / 4,713,500 - 1 = 101.50%, matching FinanceBench's 101.5%. At the cutoff the filer was
  Square, Inc. (SEC's record shows the name until 8 December 2021) with ticker SQ; its ticker is now
  XYZ, and SEC's ticker list today has no SQ, so the company must be found by name or CIK. Most of the
  growth is bitcoin revenue (4,571,543 thousand in 2020 against 516,465 thousand in 2019), which comes
  with almost equal bitcoin costs; saying so is good but not required.
