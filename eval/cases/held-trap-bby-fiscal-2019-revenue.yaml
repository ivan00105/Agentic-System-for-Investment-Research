notes: >-
  Best Buy's fiscal year ends on the Saturday nearest the end of January and takes the name of the
  calendar year it ends in. 42,879 / 42,151 - 1 = 1.73%. The FY2019 10-K says fiscal 2019 and 2017 had
  52 weeks and fiscal 2018 had 53, the extra week in the fourth quarter. The cutoff is after the FY2020
  10-K (0000764478-20-000017, filed 2020-03-23), so the trap is live: that filing shows 43,638 / 42,879
  / 42,151 for fiscal 2020 / 2019 / 2018 and repeats 42,879 unchanged.
