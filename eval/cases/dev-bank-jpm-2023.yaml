source: Hand-built (bank)
question: What were JPMorgan Chase's total net revenue, net income and operating margin in 2023?
cutoff: 2024-03-31
companies:
  - ticker: JPM
    cik: 19617
    name: JPMorgan Chase & Co.
expected:
  behaviour: answer
  must_mention:
    - Operating margin is not available because a bank's income statement has no operating income line; the metric is unsupported, not zero.
  must_not:
    - Reports an operating margin built from an invented operating income figure.
    - Treats net interest income alone as total net revenue.
gold:
