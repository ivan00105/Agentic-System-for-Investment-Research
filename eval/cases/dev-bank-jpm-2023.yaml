notes: >-
  Banks usually have no OperatingIncomeLoss (REFERENCE §5), and the Phase 1 tools return bank
  operating income as unsupported. The gold figures are the reported GAAP lines from the audited
  income statement; MD&A also discusses managed-basis results, which are not the gold. A
  pre-tax or pre-provision margin is acceptable only if it is labelled as such and not called
  operating margin.
