notes: >-
  (65,984 / 65,398) ^ (1/2) - 1 = 0.447%, which FinanceBench rounds to 0.4%. Both inputs come from the
  FY2022 10-K (its 2020 column), so one filing's figures are compared. Sales rose to 67,044 in 2021 and
  fell back in 2022, so the yearly changes differ from the two-year rate.
