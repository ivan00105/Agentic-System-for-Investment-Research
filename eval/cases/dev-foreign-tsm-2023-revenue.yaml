source: Hand-built (foreign private issuer, 20-F under IFRS)
question: What was Taiwan Semiconductor's net revenue in 2023?
cutoff: 2024-05-31
companies:
  - ticker: TSM
    cik: 1046179
    name: Taiwan Semiconductor Manufacturing Company Limited
expected:
  behaviour: answer_or_abstain
  must_mention:
    - If it answers, it gives the figure as filed in New Taiwan dollars, from IFRS statements in a 20-F, and labels
      any US$ figure as converted (at the year's average rate) or as the 20-F's convenience translation.
  must_not:
    - Presents US$70,598.8 million as the reported figure without saying it is a convenience translation at NT$30.62 per US$1.
    - Labels the NT$ figure as US dollars.
    - Crashes, or returns a US-GAAP figure for TSMC.
