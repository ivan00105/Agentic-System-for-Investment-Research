notes: >-
  Foreign filers report under IFRS (ifrs-full), not us-gaap. The Phase 1 tools mark TSM as
  unsupported, so an honest "unsupported" passes; a wrong currency or a confident US$ figure
  fails. Item 5 rounds the same figure to NT$2,161,736 million (down 4.5% from 2,263,891 in
  2022). The 20-F translates NT$ to US$ at NT$30.62 per US$1 (Fed H.10 rate on 29 December
  2023) for convenience only.
