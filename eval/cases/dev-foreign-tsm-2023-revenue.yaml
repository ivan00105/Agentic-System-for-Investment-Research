    unit: TWD millions
    fiscal_period: FY2023
    period_end: 2023-12-31
    source:
      form: 20-F
      accession: 0001193125-24-099840
      filed: 2024-04-18
      url: https://www.sec.gov/Archives/edgar/data/1046179/000119312524099840/d592628d20f.htm
