notes: >-
  Visa's statement goes from net revenues straight to operating expenses by type (personnel,
  marketing, network and processing, ...), with no cost of revenue, so a gross margin can't be built
  from the filing. An operating margin (21,000 / 32,653 = 64.3%) is a fine extra if it is labelled as
  operating margin. Like dev-bank-jpm-2023, but for a filer that is not a bank.
