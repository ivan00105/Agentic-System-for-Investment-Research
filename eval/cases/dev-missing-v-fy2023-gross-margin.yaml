source: Hand-built, a metric the filer does not report (REFERENCE §7)
question: What were Visa's net revenues, gross profit and gross margin in fiscal 2023?
cutoff: 2023-12-31
companies:
  - ticker: V
    cik: 1403161
    name: Visa Inc.
expected:
  behaviour: answer
  must_mention:
    - Gross profit and gross margin are not available because Visa's income statement has no cost of revenue or gross profit line; they are unsupported, not zero.
    - The period is the fiscal year ended 30 September 2023.
  must_not:
    - Invents a gross profit, for example from operating income (21,000) or from net revenues minus one expense line such as "Network and processing" (736).
