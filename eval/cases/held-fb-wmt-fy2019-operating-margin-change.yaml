id: held-fb-wmt-fy2019-operating-margin-change
split: held_out
case_type: check
mode: check
source: FinanceBench open sample, financebench_id_04784 (adapted)
question: By how much did Walmart's operating margin (operating income over total revenues) change from fiscal 2018 to fiscal 2019?
cutoff: 2019-04-30
companies:
  - ticker: WMT
    cik: 104169
    name: Walmart Inc.
expected:
  behaviour: answer
  must_mention:
    - The change is about +0.2 percentage points (from about 4.1% to about 4.3%), not a percent change.
    - The periods are the fiscal years ended 31 January 2019 and 31 January 2018.
  must_not:
    - Uses Walmart's own "Operating income as a percentage of net sales" (4.3 and 4.1), which divides by net sales, not total revenues, without saying so.
gold:
  - name: total_revenues_fy2019
