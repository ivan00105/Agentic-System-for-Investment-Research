notes: >-
  21,957 / 514,405 = 4.268% and 20,437 / 500,343 = 4.085%, a change of +0.18 percentage points, which
  FinanceBench rounds to 0.2%. Walmart's fiscal year ends 31 January and is named after the calendar
  year it ends in. score.py has no unit rule for percentage points, so the change item needs review;
  the two margins are scored automatically.
